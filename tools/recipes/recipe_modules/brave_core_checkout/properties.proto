syntax = "proto3";

package recipe_modules.brave.brave_core_checkout;

message InputProperties {
  // brave-core branch or tag the module checks out by default (default:
  // `master`). Set through `$brave_core_checkout`.
  string brave_core_ref = 1;

  // Build with remote execution. Feeds the `USE_REMOTEEXEC` config variable.
  bool use_remoteexec = 2;

  // Siso's cache directory; empty leaves it to the build's own default.
  string siso_cache_dir = 3;

  // Limit of concurrent remote jobs; zero leaves it to the build's default.
  int32 rbe_jobs_limit = 4;
}
